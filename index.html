<body>
<div id="app"></div>
<script>
(function(){
'use strict';
var KEY='fcc-v1';
var MN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var GROUPS={
 cash:{label:'Cash',prod:false},
 ef:{label:'Emergency Fund',prod:false,save:true},
 car:{label:'Car Fund',prod:false,save:true},
 rdpu:{label:'RDPU',prod:true,inv:true},
 gold:{label:'Gold',prod:true,inv:true},
 equity:{label:'Equity',prod:true,inv:true},
 oinv:{label:'Other Investment',prod:true,inv:true},
 oasset:{label:'Other Asset',prod:false,save:true}
};
var EQ=[['global','Global / US Equity'],['id','Indonesia Equity'],['ind','Individual / Thematic']];
var storageOK=true;

/* ---------- helpers ---------- */
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var fnum=function(n){return String(Math.round(Math.abs(n))).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
var fin=function(n){return (n<0?'-':'')+fnum(n);};
var rp=function(n){return (n==null||isNaN(n))?'Not entered':(n<0?'-':'')+'Rp'+fnum(n);};
var sgn=function(n){return n==null?'—':(n>0?'+':n<0?'-':'')+'Rp'+fnum(n);};
function rps(n){if(n==null||isNaN(n))return 'Not entered';var a=Math.abs(n),s=n<0?'-':'';
 if(a>=1e9)return s+'Rp'+(a/1e9).toFixed(2).replace(/\.?0+$/,'').replace('.',',')+' M';
 if(a>=1e6)return s+'Rp'+(a/1e6).toFixed(1).replace(/\.0$/,'').replace('.',',')+' jt';
 return s+'Rp'+fnum(a);}
var pc=function(n,d){d=d==null?1:d;return (n==null||!isFinite(n))?'—':n.toFixed(d).replace('.',',')+'%';};
var pm=function(s){var d=String(s==null?'':s).replace(/[^\d]/g,'');return d===''?null:Number(d);};
var pms=function(s){var v=pm(s);return v==null?null:(/^\s*-/.test(String(s))?-v:v);};
var sum=function(a){return a.reduce(function(x,y){return x+(+y||0);},0);};
var clamp=function(v,a,b){return Math.min(b,Math.max(a,v));};
var mlabel=function(k){var p=k.split('-');return MN[+p[1]-1]+' '+p[0];};
var mshort=function(k){var p=k.split('-');return MN[+p[1]-1]+' '+p[0].slice(2);};
var madd=function(k,n){var p=k.split('-').map(Number);var i=p[0]*12+(p[1]-1)+n;return Math.floor(i/12)+'-'+String(i%12+1).padStart(2,'0');};
var mdiff=function(a,b){var x=a.split('-').map(Number),y=b.split('-').map(Number);return (y[0]*12+y[1])-(x[0]*12+x[1]);};
var dur=function(n){if(n==null)return '> 100 th';if(n===0)return 'Reached';var y=Math.floor(n/12),m=n%12;return ((y?y+' th ':'')+(m?m+' bln':'')).trim()||'0';};
var mo=function(n){return n.toFixed(1).replace('.',',')+' months';};
var uniq=function(a){return a.filter(function(x,i){return a.indexOf(x)===i;});};

/* ---------- defaults & storage ---------- */
function defaults(){
 var base={housing:1300000,utilities:200000,family:1000000,food:1800000,transport:150000,lifestyle:420000,skills:481997,debt:0,other:0};
 var e=function(d){var o=Object.assign({},base);o.debt=d;return o;};
 var half={housing:650000,utilities:100000,family:500000,food:900000,transport:75000,lifestyle:210000,skills:240998,debt:0,other:0};
 var mk=function(inc,exp,alloc,other,label,partial){return {income:inc,other:other||0,otherLabel:label||'',exp:exp,alloc:alloc,partial:!!partial};};
 return {v:3,
  settings:{salary:11750000,essential:5351997,efMin:30000000,efTarget:35000000,bufMin:3000000,bufMax:5000000,
   carTarget:115000000,carMonth:'',fi1:1500000000,fi2:2000000000,ret:5,infl:0,scen:[5000000,7000000,10000000],
   payday:28,trackStart:'2026-11',setupDone:false,goldMin:5,goldMax:10,eqT:{global:[50,60],id:[25,35],ind:[5,10]},eqWarn:5,phase:'auto',tol:1000,gap:2,newSalary:null,
   phasePct:{'1':{ef:50,cash:21,rdpu:12,gold:5,equity:12},'2':{car:40,equity:35,rdpu:12,gold:6,cash:7}}},
  cats:[
   {id:'housing',name:'Housing',kind:'fixed',hint:'Kost',payFrom:'cimb'},
   {id:'utilities',name:'Utilities',kind:'fixed',hint:'Listrik',payFrom:'cimb'},
   {id:'family',name:'Family',kind:'fixed',hint:'Transfer orang tua',payFrom:'cimb'},
   {id:'food',name:'Food',kind:'variable',hint:'Makan',payFrom:'seabank'},
   {id:'transport',name:'Transportation',kind:'variable',hint:'Bensin',payFrom:'seabank'},
   {id:'lifestyle',name:'Lifestyle',kind:'variable',hint:'Kebutuhan lain',payFrom:'seabank'},
   {id:'skills',name:'Skills',kind:'variable',hint:'Skills & sertifikasi',payFrom:'cimb'},
   {id:'debt',name:'Debt',kind:'debt',hint:'Credit card',payFrom:'cimb'},
   {id:'other',name:'Other',kind:'variable',hint:'',payFrom:'cimb'}],
  accounts:[
   {id:'cimb',name:'CIMB',group:'cash',role:'Salary + operating + cash buffer',buffer:true,active:true,start:null},
   {id:'seabank',name:'SeaBank',group:'cash',role:'Lifestyle / daily spending',envelope:true,active:true,start:null},
   {id:'krom',name:'Krom',group:'ef',role:'Emergency Fund',active:true,start:null},
   {id:'bca',name:'BCA',group:'cash',role:'Secondary account',active:true,start:null},
   {id:'bibit',name:'Bibit',group:'rdpu',role:'RDPU / conservative',active:true,start:null},
   {id:'pegadaian',name:'Pegadaian',group:'gold',role:'Gold — diversification',active:true,start:null},
   {id:'broker',name:'Equity Broker',group:'equity',role:'Stocks / ETF — long term',active:true,start:null},
   {id:'carfund',name:'Car Fund',group:'car',role:'Car purchase bucket',active:true,start:null}],
  plan:{
   '2026-10':mk(11750000,e(1275000),{krom:2500000,bibit:750000,pegadaian:300000,broker:500000}),
   '2026-11':mk(11750000,e(275000),{krom:3000000,bibit:750000,pegadaian:300000,broker:750000}),
   '2026-12':mk(11750000,e(275000),{krom:3000000,bibit:750000,pegadaian:300000,broker:750000}),
   '2027-01':mk(11750000,e(0),{krom:3000000,bibit:750000,pegadaian:300000,broker:1000000}),
   '2027-02':mk(5875000,half,{krom:13500000,bibit:400000,pegadaian:150000,broker:300000},12000000,'Kompensasi kontrak',true)},
  records:{}};
}
function merge(d,p){
 if(!p||typeof p!=='object')return d;
 var o=Object.assign({},d,p),ps=p.settings||{};
 o.settings=Object.assign({},d.settings,ps);
 o.settings.eqT=Object.assign({},d.settings.eqT,ps.eqT||{});
 o.settings.phasePct=Object.assign({},d.settings.phasePct,ps.phasePct||{});
 if(!Array.isArray(o.cats)||!o.cats.length)o.cats=d.cats;
 if(!Array.isArray(o.accounts)||!o.accounts.length)o.accounts=d.accounts;
 var dp={};d.cats.forEach(function(c){dp[c.id]=c.payFrom;});
 o.cats=o.cats.map(function(c){return c.payFrom===undefined?Object.assign({},c,{payFrom:dp[c.id]||'cimb'}):c;});
 o.accounts=o.accounts.map(function(a){return (a.id==='seabank'&&a.envelope===undefined)?Object.assign({},a,{envelope:true}):a;});
 o.plan=p.plan||d.plan;o.records=p.records||{};o.v=3;
 return o;
}
function loadState(){
 var raw=null;
 try{raw=localStorage.getItem(KEY);}catch(e){storageOK=false;}
 var d=defaults();
 if(!raw)return d;
 try{return merge(d,JSON.parse(raw));}catch(e){return d;}
}
var S=loadState();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false;}}
var ui={tab:'dash',month:null,umonth:null,report:null,confirm:null,msg:null,trace:null};

/* ---------- model ---------- */
var act=function(){return S.accounts.filter(function(a){return a.active!==false;});};
var grp=function(g){return act().filter(function(a){return a.group===g;});};
var recs=function(){return Object.keys(S.records).sort();};
function hub(){return act().find(function(a){return a.buffer&&a.group==='cash';})||grp('cash')[0]||null;}
function acctForGroup(g){return g==='cash'?hub():grp(g)[0];}
function payFromOf(c){var a=act().find(function(x){return x.id===c.payFrom&&x.group==='cash';});if(a)return a.id;var H=hub();return H?H.id:null;}
function envAccs(){var H=hub();return act().filter(function(a){return a.envelope&&a.group==='cash'&&!(H&&a.id===H.id);});}
function isEnvCat(c){var id=payFromOf(c);return envAccs().some(function(a){return a.id===id;});}
function firstTracked(){var ks=recs();return ks.length?ks[0]:(S.settings.trackStart||'2026-11');}
function cycleLabel(k){var pd=+S.settings.payday||1;if(pd<=1)return mlabel(k);var p=k.split('-').map(Number),pr=madd(k,-1).split('-').map(Number);return mlabel(k)+' · '+pd+' '+MN[pr[1]-1]+' – '+(pd-1)+' '+MN[p[1]-1];}
/* effective transfers = typed transfers + money taken from other pos (cover) + repayments */
function ecOf(rec){
 var o=Object.assign({},rec.contrib||{}),H=hub(),E=envAccs()[0];
 (rec.cover||[]).forEach(function(c){if(!c.amount||!c.from||(H&&c.from===H.id)||(E&&c.from===E.id))return;o[c.from]=(o[c.from]||0)-c.amount;if(E)o[E.id]=(o[E.id]||0)+c.amount;});
 Object.keys(rec.repay||{}).forEach(function(id){o[id]=(o[id]||0)+(rec.repay[id]||0);});
 return o;
}
function spendOf(rec,id){
 var a=S.accounts.find(function(x){return x.id===id;});
 if(a&&a.envelope&&rec.es&&rec.es[id]!=null)return rec.es[id];
 var t=0;S.cats.forEach(function(c){if(payFromOf(c)===id)t+=(rec.exp&&rec.exp[c.id])||0;});return t;
}
function envSpends(prev,rec){
 var o={},ec=ecOf(rec);
 envAccs().forEach(function(a){var open=prev[a.id]==null?null:prev[a.id],ac=rec.bal?rec.bal[a.id]:null;o[a.id]=(open!=null&&ac!=null)?open+(ec[a.id]||0)-ac:null;});
 return o;
}
function owedAt(m,incl){
 var o={},notes={};
 recs().filter(function(k){return incl?k<=m:k<m;}).forEach(function(k){var r=S.records[k];
  (r.cover||[]).forEach(function(c){if(c.amount&&c.from){o[c.from]=(o[c.from]||0)+c.amount;(notes[c.from]=notes[c.from]||[]).push(mshort(k)+(c.note?' · '+c.note:''));}});
  Object.keys(r.repay||{}).forEach(function(id){o[id]=(o[id]||0)-(r.repay[id]||0);});});
 var out=[];Object.keys(o).forEach(function(id){if(o[id]>0){var a=S.accounts.find(function(x){return x.id===id;});out.push({id:id,name:a?a.name:id,amt:o[id],notes:(notes[id]||[]).join('; ')});}});
 return out;
}
function budgetRows(m,rec){
 var B=(planFor(m)||{}).exp||{},rows=[];

 h+='<section class="card"><h3>Kategori pengeluaran</h3><p class="sub">“Dibayar dari” menentukan rekening kas mana yang berkurang. Ini membuat saldo sistem sama dengan aplikasi bank.</p><div class="scroll"><table><tr><th>Kategori</th><th>Jenis</th><th>Dibayar dari</th></tr>'+S.cats.map(function(c){return '<tr><td>'+esc(c.name)+(c.hint?' <span class="mut small">'+esc(c.hint)+'</span>':'')+'</td><td>'+esc(c.kind)+'</td><td><select data-cp="'+c.id+'" style="min-width:130px">'+cashOpts.map(function(a){return '<option value="'+a.id+'"'+(a.id===payFromOf(c)?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select></td></tr>';}).join('')+'</table></div>'+act().filter(function(a){return a.group==='cash'&&!(hub()&&a.id===hub().id);}).map(function(a){return '<label class="f" style="margin-top:10px;max-width:420px">Pola amplop untuk '+esc(a.name)+'<small>Ya = belanja dihitung dari saldo (tidak dicatat per transaksi)</small><select data-env="'+a.id+'"><option value="1"'+(a.envelope?' selected':'')+'>Ya</option><option value="0"'+(a.envelope?'':' selected')+'>Tidak</option></select></label>';}).join('')+'<div class="fg" style="margin-top:10px"><label class="f">Nama kategori baru<input type="text" id="nc-name" placeholder="mis. Insurance"></label><label class="f">Jenis<select id="nc-kind"><option value="fixed">Fixed</option><option value="variable">Variable</option><option value="debt">Debt</option></select></label></div><div class="row" style="margin-top:10px"><button class="btn primary" data-act="addcat">Tambah kategori</button></div></section>';
 h+='<section class="card"><h3>Backup &amp; restore</h3><p class="sub">Data tersimpan di browser ini saja. Salin teks di bawah ke tempat aman secara berkala, dan tempel kembali untuk memulihkan.</p><textarea id="bk" spellcheck="false">'+esc(JSON.stringify(S))+'</textarea><div class="row" style="margin-top:10px"><button class="btn" data-act="copybk">Copy backup</button><button class="btn primary" data-act="import">Restore dari teks</button>'+cbtn('reset','Reset semua data','danger')+'</div></section>';
 return h;
}
function render(){
 var y=window.scrollY,ps=document.getElementById('planscroll'),px=ps?ps.scrollLeft:0;
 var body={dash:vDash,tx:vTx,update:vUpdate,assets:vAssets,goals:vGoals,settings:vSettings}[ui.tab]();
 var msg=ui.msg;ui.msg=null;
 document.getElementById('app').innerHTML='<div class="wrap">'+header()+nav()+(storageOK?'':'<div class="banner">Penyimpanan browser tidak tersedia — data hilang saat halaman ditutup. Gunakan Backup di Settings.</div>')+(msg?'<div class="banner ok">'+esc(msg)+'</div>':'')+'<main>'+body+'</main></div>';
 var p2=document.getElementById('planscroll');if(p2)p2.scrollLeft=px;
 window.scrollTo(0,y);
 if(ui.tab==='update')updateLive();
}

/* ---------- events ---------- */
function doSave(stage){
 var rec=readForm(),m=ui.umonth;if(!rec)return;
 var missing=[];
 if(rec._st){act().forEach(function(x){if(rec._st[x.id]!==undefined)x.start=rec._st[x.id];if(rec._st[x.id]==null)missing.push(x.name);});delete rec._st;}
 rec.stage=stage;rec.savedAt=Date.now();S.records[m]=rec;recompute();save();ui.month=m;
 var msg;
 if(stage==='open'){ui.report=null;msg='Langkah 1 tersimpan ('+cycleLabel(m)+'). Isi Langkah 2 di akhir siklus.';}
 else{ui.report=m;msg='Siklus '+mlabel(m)+' ditutup.';var ne=envAccs().filter(function(a){return rec.bal[a.id]==null;}).map(function(a){return a.name;});if(ne.length)msg+=' Saldo '+ne.join(', ')+' belum diisi, jadi belanja harian masih memakai budget (perkiraan).';}
 if(missing.length)msg+=' Saldo awal belum diisi untuk: '+missing.join(', ')+'.';
 ui.msg=msg;render();window.scrollTo(0,0);
}
function copyText(t,okmsg){
 var done=function(){ui.msg=okmsg;render();};
 try{navigator.clipboard.writeText(t).then(done,function(){ui.msg='Salin manual: pilih teks lalu copy.';render();});}catch(e){ui.msg='Salin manual: pilih teks lalu copy.';render();}
}
function two(key){if(ui.confirm===key){ui.confirm=null;return true;}ui.confirm=key;render();return false;}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-act]');if(!b)return;e.preventDefault();
 var p=b.getAttribute('data-act').split(':'),a=p[0],arg=p[1];
 if(a==='tab'){ui.tab=arg;ui.confirm=null;render();window.scrollTo(0,0);return;}
 if(a==='setupdone'){var any=act().some(function(x){return x.start!=null;});if(!any){ui.msg='Isi minimal satu saldo rekening dulu.';render();return;}S.settings.setupDone=true;save();ui.msg='Data aset awal tersimpan. Tracking dimulai dari siklus '+mlabel(firstTracked())+'.';render();window.scrollTo(0,0);return;}
 if(a==='setupedit'){if(!recs().length){S.settings.setupDone=false;save();render();window.scrollTo(0,0);}else{ui.tab='assets';render();window.scrollTo(0,0);}return;}
 if(a==='saveopen'||a==='saveclose'){doSave(a==='saveclose'?'closed':'open');return;}
 if(a==='addc'){var dd=document.createElement('div');dd.innerHTML=crow(null,coverOpts());document.getElementById('crows').appendChild(dd.firstChild);return;}
 if(a==='addx'){var d=document.createElement('div');d.innerHTML=xrow('',0);document.getElementById('xrows').appendChild(d.firstChild);return;}
 if(a==='rmx'){var r=b.closest('.xrow');if(r)r.remove();updateLive();return;}
 if(a==='delmonth'){if(two('delmonth')){delete S.records[ui.umonth];recompute();save();ui.report=null;ui.month=null;ui.msg='Bulan dihapus.';render();}return;}
 if(a==='copyrep'){var el=document.getElementById('rep');if(el)copyText(el.textContent,'Laporan disalin.');return;}
 if(a==='copybk'){var t=document.getElementById('bk');if(t)copyText(t.value,'Backup disalin.');return;}
 if(a==='arch'){var ac=S.accounts.find(function(x){return x.id===arg;});if(ac){ac.active=ac.active===false;recompute();save();render();}return;}
 if(a==='addacc'){var n=document.getElementById('na-name').value.trim();if(!n){ui.msg='Isi nama akun dulu.';render();return;}
  var id=slug(n),base=id,i=2;while(S.accounts.some(function(x){return x.id===id;}))id=base+'_'+(i++);
  S.accounts.push({id:id,name:n,group:document.getElementById('na-group').value,role:document.getElementById('na-role').value.trim(),active:true,start:null});recompute();save();ui.msg=n+' ditambahkan. Isi saldo awalnya di tabel Assets.';render();return;}
 if(a==='addcat'){var cn=document.getElementById('nc-name').value.trim();if(!cn){ui.msg='Isi nama kategori dulu.';render();return;}
  var cid=slug(cn),cb=cid,j=2;while(S.cats.some(function(x){return x.id===cid;}))cid=cb+'_'+(j++);
  var H=hub();S.cats.push({id:cid,name:cn,kind:document.getElementById('nc-kind').value,hint:'',payFrom:H?H.id:'cimb'});recompute();save();ui.msg='Kategori ditambahkan.';render();return;}
 if(a==='addplan'){var ks=Object.keys(S.plan).sort(),nk=madd(ks[ks.length-1],1),src=null;ks.forEach(function(k){if(!S.plan[k].partial)src=S.plan[k];});src=src||S.plan[ks[ks.length-1]];
  S.plan[nk]={income:src.income,other:0,otherLabel:'',exp:Object.assign({},src.exp),alloc:Object.assign({},src.alloc),partial:false};save();render();return;}
 if(a==='rmplan'){if(two('rmplan')){var ks2=Object.keys(S.plan).sort();if(ks2.length>1)delete S.plan[ks2[ks2.length-1]];save();render();}return;}
 if(a==='import'){try{var o=JSON.parse(document.getElementById('bk').value);if(!o||!o.records||!o.accounts)throw 0;S=merge(defaults(),o);recompute();save();ui.month=null;ui.umonth=null;ui.report=null;ui.msg='Data dipulihkan.';render();}catch(err){ui.msg='Teks backup tidak valid.';render();}return;}
 if(a==='reset'){if(two('reset')){S=defaults();recompute();save();ui.month=null;ui.umonth=null;ui.report=null;ui.msg='Data direset ke pengaturan awal.';render();}return;}
});
document.addEventListener('change',function(e){
 var t=e.target,d=t.dataset||{};
 if(t.classList&&t.classList.contains('mi')){var neg=(t.getAttribute('data-f')||'').indexOf('contrib:')===0,v=neg?pms(t.value):pm(t.value);t.value=v==null?'':fin(v);}
 if(d.sel){if(d.sel==='month')ui.month=t.value;else if(d.sel==='trace')ui.trace=t.value;else{ui.umonth=t.value;ui.report=null;}render();return;}
 if(t.closest&&t.closest('#uform'))return;
 var v2=pm(t.value),num=parseFloat(String(t.value).replace(',','.'));
 if(d.cp){var c=S.cats.find(function(x){return x.id===d.cp;});if(c){c.payFrom=t.value;recompute();}}
 else if(d.env){var ea=S.accounts.find(function(x){return x.id===d.env;});if(ea){ea.envelope=t.value==='1';recompute();}}
 else if(d.s){if(d.s==='newSalary')S.settings.newSalary=v2;else if(v2!=null)S.settings[d.s]=v2;}
 else if(d.sn){if(isFinite(num))S.settings[d.sn]=num;}
 else if(d.sv){S.settings[d.sv]=t.value.trim();}
 else if(d.sc){if(v2!=null)S.settings.scen[+d.sc]=v2;}
 else if(d.eq){var q=d.eq.split('|');if(isFinite(num))S.settings.eqT[q[0]][+q[1]]=num;}
 else if(d.ph){var r=d.ph.split('|');if(isFinite(num))S.settings.phasePct[r[0]][r[1]]=num;}
 else if(d.f&&d.f.indexOf('st:')===0){var a=S.accounts.find(function(x){return x.id===d.f.slice(3);});if(a){a.start=v2;recompute();}}
 else if(d.f&&d.f.indexOf('p:')===0){var z=d.f.slice(2).split('|'),pl=S.plan[z[0]],kk=z[1];if(pl){var val=v2||0;if(kk==='income')pl.income=val;else if(kk==='other')pl.other=val;else if(kk.indexOf('exp:')===0)pl.exp[kk.slice(4)]=val;else if(kk.indexOf('alloc:')===0)pl.alloc[kk.slice(6)]=val;}}
 else return;
 save();render();
});
document.addEventListener('input',function(e){
 var t=e.target;if(!t.closest||!t.closest('#uform'))return;
 var f=t.getAttribute('data-f')||'';
 if(f.indexOf('eq:')===0){var ea=grp('equity')[0],vals=EQ.map(function(x){var el=document.querySelector('[data-f="eq:'+x[0]+'"]');return el?pm(el.value):null;}).filter(function(v){return v!=null;});
  if(ea&&vals.length){var bi=document.querySelector('[data-f="bal:'+ea.id+'"]');if(bi)bi.value=fnum(sum(vals));}}
 if(t.hasAttribute&&t.hasAttribute('data-auto'))t.removeAttribute('data-auto');
 if(f.indexOf('exp:')===0){document.querySelectorAll('[data-auto]').forEach(function(el){
  var id=el.getAttribute('data-auto'),tot=0;
  S.cats.forEach(function(c){if(payFromOf(c)===id){var x=document.querySelector('[data-f="exp:'+c.id+'"]');tot+=x?(pm(x.value)||0):0;}});
  el.value=fnum(tot);});}
 updateLive();
});
render();
})();
